<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body {
    background:#F5F7FA;
    font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;
    color:#12294B;
    position:relative;
  }
  #stage { position:absolute; inset:0; padding:0 64px; }

  #header { padding-top:56px; display:flex; align-items:center; gap:20px; }
  #header img { height:110px; }

  #chat { margin-top:40px; display:flex; flex-direction:column; }

  #userBubble {
    align-self:flex-end;
    background:#12294B; color:#fff;
    font-size:46px; font-weight:600;
    padding:28px 44px; border-radius:36px 36px 8px 36px;
    opacity:0; box-shadow:0 8px 24px rgba(18,41,75,.18);
  }

  #inputScene { position:absolute; left:0; right:0; top:0; bottom:0; }
  #topbar {
    position:absolute; left:0; right:0; top:0; height:150px; background:#fff;
    border-bottom:2px solid #E9EDF2; display:flex; align-items:center; padding:0 48px;
  }
  #topbar .menu { font-size:52px; color:#5B6B80; }
  #topbar .model { margin-left:36px; font-size:44px; font-weight:700; color:#12294B; display:flex; align-items:center; gap:14px;}
  #topbar .model .badge { font-size:30px; font-weight:600; color:#C08A2D; background:#F7EEDC; border-radius:999px; padding:6px 20px;}
  #topbar .model .chev { font-size:32px; color:#8A97A8; }
  #topbar .avatar {
    margin-left:auto; width:76px; height:76px; border-radius:50%;
    background:linear-gradient(135deg,#12294B,#3D5A8A); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700;
  }
  #greet { position:absolute; left:0; right:0; top:560px; text-align:center; padding:0 60px; }
  #greet .g1 { font-size:62px; font-weight:800; color:#12294B; letter-spacing:1px; }
  #greet .g2 { font-size:36px; color:#8A97A8; margin-top:34px; }
  #chips { position:absolute; left:0; right:0; top:840px; display:flex; justify-content:center; gap:32px; flex-wrap:wrap; padding:0 60px;}
  .chip {
    font-size:34px; color:#3D4F66; background:#fff; border:2px solid #E0E6EE;
    border-radius:999px; padding:20px 42px; box-shadow:0 4px 14px rgba(18,41,75,.05);
  }
  .chip.hot { color:#C08A2D; border-color:#E8D9BC; }
  #inputDock { position:absolute; left:48px; right:48px; top:1200px; }
  .inputBox {
    background:#fff; border:3px solid #E0E6EE; border-radius:52px;
    padding:30px 36px; display:flex; align-items:center;
    box-shadow:0 14px 44px rgba(18,41,75,.10);
  }
  .inputBox.focused { border-color:#B9C6D6; box-shadow:0 14px 44px rgba(18,41,75,.16); }
  .iconBtn {
    width:84px; height:84px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:46px; color:#5B6B80; background:#F1F4F8;
  }
  .inputBox .txt { font-size:48px; min-height:64px; flex:1; white-space:nowrap; margin:0 32px; overflow:hidden;}
  .inputBox .txt .ph { color:#B6C0CC; }
  .caret {
    display:inline-block; width:5px; height:56px; background:#12294B;
    vertical-align:-8px; margin-left:4px;
  }
  .micBtn { background:transparent; }
  #sendBtn {
    width:84px; height:84px; border-radius:50%; flex-shrink:0; margin-left:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:44px; color:#fff; background:#C9D3DF; font-weight:800;
  }
  #sendBtn.armed { background:#12294B; }
  #sendBtn.pressed { background:#C08A2D; transform:scale(.92); }
  #dockNote { text-align:center; font-size:28px; color:#A8B3C0; margin-top:26px; letter-spacing:1px;}

  #thinkPanel {
    margin-top:44px;
    background:#fff; border-radius:28px; border-left:10px solid #C08A2D;
    padding:40px 44px; box-shadow:0 10px 36px rgba(18,41,75,.08);
    opacity:0;
  }
  #thinkTitle { font-size:40px; font-weight:700; color:#C08A2D; margin-bottom:28px; display:flex; align-items:center; gap:16px;}
  #thinkTitle .spinner {
    width:34px; height:34px; border-radius:50%;
    border:5px solid #E8D9BC; border-top-color:#C08A2D;
  }
  .thinkLine { font-size:38px; line-height:1.75; color:#3D4F66; margin-bottom:10px; min-height:66px; opacity:0;}
  .thinkLine .hl { color:#12294B; font-weight:700; background:linear-gradient(transparent 68%, #F0DDB4 68%); padding:0 2px;}
  #thinkPanel.collapsed .thinkLine, #thinkPanel.collapsed #thinkTitle .spinner { display:none; }

  #answer { margin-top:44px; opacity:0; }
  #ansLabel { font-size:36px; font-weight:700; color:#8A97A8; letter-spacing:4px; margin-bottom:24px;}
  #ansBody {
    background:#fff; border-radius:28px; padding:44px 48px 36px;
    box-shadow:0 10px 36px rgba(18,41,75,.08);
  }
  #ansBody p {
    font-size:38px; line-height:1.7; color:#26374E; margin-bottom:28px;
  }
  #ansBody p.meta { font-size:32px; color:#8A97A8; }
  #ansBody p.h { font-size:42px; font-weight:800; color:#12294B; margin:14px 0 20px; }
  #ansBody b { color:#12294B; font-weight:800; background:linear-gradient(transparent 70%, #F0DDB4 70%); }
  #ansBody .cursorBlock {
    display:inline-block; width:22px; height:42px; background:#12294B;
    vertical-align:-6px; margin-left:6px; border-radius:4px;
  }
  #ansBody table {
    width:100%; border-collapse:collapse; margin:8px 0 32px;
    font-size:32px; color:#26374E;
  }
  #ansBody table th {
    background:#12294B; color:#fff; font-weight:700; text-align:left;
    padding:16px 20px; font-size:31px;
  }
  #ansBody table td {
    border-bottom:2px solid #E4E9F0; padding:14px 20px; line-height:1.5;
  }
  #ansBody table tr:nth-child(even) td { background:#F7F9FC; }
  #bottomFade {
    position:absolute; left:0; right:0; bottom:0; height:160px; pointer-events:none;
    background:linear-gradient(rgba(245,247,250,0), #F5F7FA 85%);
  }

  #ending { position:absolute; inset:0; background:rgba(245,247,250,0); pointer-events:none; }
  #endCenter { position:absolute; left:0; right:0; top:560px; text-align:center; opacity:0; }
  #endCenter .l1 { font-size:64px; font-weight:800; }
  #endCenter .l2 { font-size:52px; font-weight:600; color:#C08A2D; margin-top:24px; }
  #endInput { position:absolute; left:64px; right:64px; top:900px; opacity:0; }
  #disclaimer {
    position:absolute; left:0; right:0; bottom:70px; text-align:center;
    font-size:32px; color:#9AA6B5; opacity:0; letter-spacing:2px;
  }
  .danmaku {
    position:absolute; white-space:nowrap;
    background:rgba(18,41,75,.85); color:#fff;
    font-size:40px; padding:18px 40px; border-radius:999px;
  }

  #hook { position:absolute; inset:0; background:#0C1C36; z-index:50;
    display:flex; flex-direction:column; justify-content:center; padding:0 90px; }
  #hook .hl1 { font-size:110px; font-weight:900; color:#fff; line-height:1.35; opacity:0; }
  #hook .hl1 b { color:#E8B54D; font-weight:900; }
  #hook .hsub { font-size:42px; color:#8FA0B8; margin-top:70px; opacity:0; letter-spacing:2px; }
  .bigpop { position:absolute; left:0; right:0; text-align:center; z-index:40;
    font-size:200px; font-weight:900; color:#C08A2D; text-shadow:0 10px 40px rgba(18,41,75,.25);
    opacity:0; pointer-events:none; }
</style>
</head>

  <div id="hook">
    <div class="hl1" id="hk0">市场<b>付过钱</b></div>

  <div id="ending">

      <div class="l2" id="endL2">Deep Fomo 公开跑一次</div>

    <div id="endInput">
      <div class="inputBox focused">
        <span class="iconBtn">＋</span>
        <span class="txt"><span class="ph" id="endPh">直接评论：深挖 + 股票名</span><span class="caret" id="endCaret"></span></span>
        <span style="width:84px;height:84px;border-radius:50%;flex-shrink:0;margin-left:12px;display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff;background:#12294B;font-weight:800;">↑</span>
      </div>

    <div class="danmaku" id="dm1"></div>

  </div>
</div>

<script>
window.CONTENT = {
 question: "深挖汇成股份",
 rate: 85,
 greeting: ["Deep Fomo · A 股深度研究 Agent","盘面 × 证据 × 生命周期，一次问答跑完一份研究报告"],
 chips: ["个股深度研究","题材深度探索","行情前瞻研判"],
 ending: ["让研究先于情绪","Deep Fomo · A 股深度研究 Agent"],
 end_placeholder: "问点什么…",
 danmaku: ["明天怎么看？","高位分歧怎么办？","下一个主线是什么？"],
 think: [
  [{t:"验鲜：本地 DuckDB 最新 trade_date "},{t:"2026-06-30",hl:1},{t:"，用最新盘面说话。"}],
  [{t:"它主业其实是 "},{t:"DDIC 封测",hl:1},{t:"，但市场在交易先进封装预期——这里有错位。"}],
  [{t:"6/9→6/25 峰值涨幅 72.37%，收益保留率 90.77%，"},{t:"市场确实付过钱",hl:1},{t:"。"}],
  [{t:"但 6/30 板块大涨它反跌 0.8%，"},{t:"强板块弱个股",hl:1},{t:"，重判为"},{t:"高位分歧观察",hl:1},{t:"。"}]
 ],
 answer: [
  {segs:[{t:"直接给结论："},{t:"市场付过钱、证据没跟上、替代者已出现",b:1},{t:"——现在的问题不是它有没有逻辑，而是二次定价之后还能不能升级。"}]},
  {cls:"h", segs:[{t:"一、市场已经定价了什么"}]},
  {segs:[{t:"6 月 9 日 23.96 元到 6 月 25 日 41.30 元，峰值涨幅约 "},{t:"72.37%",b:1},{t:"；6 月 30 日仍收 39.70 元，收益保留率约 "},{t:"90.77%",b:1},{t:"。市场已经为先进封装弹性选过它一轮，这不是脉冲。"}]},
  {cls:"h", segs:[{t:"二、证据跟上了吗"}]},
  {segs:[{t:"硬证据只有 DDIC 封测基本盘和扩产；长鑫链是权益法不并表、鑫丰还在亏损；互动问答明确"},{t:"“暂无涉足玻璃基板封装计划”",b:1},{t:"。"}]},
  {table:{head:["证据点","硬度"],rows:[["DDIC 封测收入与销量增长","硬证据"],["鑫丰 / 长鑫链（权益法）","中"],["先进封装 / 2.5D/3D","中低"],["玻璃基板封装","反证"]]}},
  {cls:"h", segs:[{t:"三、替代者已出现"}]},
  {segs:[{t:"6 月 30 日半导体集体大涨，它反而跌 0.8%："},{t:"不是板块不行，而是资金在同链里买了更强的前排",b:1},{t:"（颀中、甬矽、深科技…）。"}]},
  {cls:"h", segs:[{t:"结论"}]},
  {segs:[{t:"从主线弹性挖掘，切到"},{t:"高位分歧后的再验证",b:1},{t:"：重新新高 + L3 级新证据，才有资格升级。（非投资建议）"}]}
 ]
};

<script>
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const ease = t=>t<0?0:t>1?1:t*t*(3-2*t);
const $ = id=>document.getElementById(id);

function typeSegs(segs, n){
  let out='', left=n;
  for(const s of segs){
    if(left<=0) break;
    const take = s.t.slice(0, left);
    out += s.hl ? '<span class="hl">'+take+'</span>' : take;
    left -= take.length;
  }
  return out;
}
const segLen = segs=>segs.reduce((a,s)=>a+s.t.length,0);

/* ---- content injected via content.js (window.CONTENT) ---- */
const C = window.CONTENT;
const QUESTION = C.question;
const THINK = C.think;

/* dynamic timing: think lines sized by length */
const THINK_START = 4.6, THINK_LGAP = 0.15;
let _tt = THINK_START;
const THINK_T = THINK.map(l=>{
  const d = clamp(segLen(l)/40, 1.0, 1.7);
  const r = [_tt, _tt + d]; _tt = r[1] + THINK_LGAP; return r;
});
const THINK_END = THINK_T[THINK_T.length-1][1];
const COLLAPSE_T = THINK_END + 0.3;
const ANS_FADE = THINK_END + 0.6;
const THINK_SECS = Math.round(THINK_END - 4.4);

const ANSWER = C.answer;

/* fill static texts from content */
$('userBubble').textContent = QUESTION;
if(C.greeting){ $('greetG1').textContent = C.greeting[0]; $('greetG2').textContent = C.greeting[1]; }
if(C.chips){ $('chips').innerHTML = C.chips.map((c,i)=>'<span class="chip'+(i===0?' hot':'')+'">'+c+'</span>').join(''); }
if(C.ending){ $('endL1').textContent = C.ending[0]; $('endL2').textContent = C.ending[1]; }
if(C.end_placeholder){ $('endPh').textContent = C.end_placeholder; }
const DM_TXT = C.danmaku || [];
for(let i=0;i<3;i++) $('dm'+i).textContent = DM_TXT[i] || '';
const TL = THINK.map(()=>{
  const el = document.createElement('div');
  el.className = 'thinkLine';
  $('thinkPanel').appendChild(el);
  return el;
});

const ANS_START = THINK_END + 0.8, ANS_RATE = C.rate || 75, ANS_GAP = 0.3;
const TABLE_LEN = 90; // virtual chars for a table (≈1.2s)
let _acc = ANS_START;
const ANS_SCHED = ANSWER.map(p=>{
  const L = p.table ? TABLE_LEN : segLen(p.segs);
  const s = {start:_acc, len:L, end:_acc + L/ANS_RATE};
  _acc = s.end + ANS_GAP;
  return s;
});
const ANS_DONE = _acc;

const ansBody = document.getElementById('ansBody');
function tableHTML(tb){
  let h = '<table><tr>' + tb.head.map(c=>'<th>'+c+'</th>').join('') + '</tr>';
  for(const r of tb.rows) h += '<tr>' + r.map(c=>'<td>'+c+'</td>').join('') + '</tr>';
  return h + '</table>';
}
const ANS_P = ANSWER.map(p=>{
  let el;
  if(p.table){
    el = document.createElement('div');
    el.innerHTML = tableHTML(p.table);
  } else {
    el = document.createElement('p');
    if(p.cls) el.className = p.cls;
  }
  el.style.display = 'none';
  ansBody.appendChild(el);
  return el;
});
function typeB(segs, n){
  let out='', left=n;
  for(const s of segs){
    if(left<=0) break;
    const take = s.t.slice(0,left);
    out += s.b ? '<b>'+take+'</b>' : take;
    left -= take.length;
  }
  return out;
}

const END_T = ANS_DONE + 1.4;
const TOTAL = END_T + 7.0;
window.TOTAL = TOTAL;
window.TIMING = {type_span:[0.9,2.5], submit:3.5, think:THINK_T, ans:ANS_SCHED.map(s=>[s.start,s.end]), end_t:END_T, total:TOTAL};
const DM = [
  {id:'dm0', t0:END_T+0.6, y:1300, dur:5.2},
  {id:'dm1', t0:END_T+1.8, y:1420, dur:5.4},
  {id:'dm2', t0:END_T+3.0, y:1540, dur:5.2},
];

const HOOK_D = 3.4;
const POPS = [
  {el:'bp0', t0: ANS_SCHED[2].start + 0.5, dur: 1.4},
  {el:'bp1', t0: ANS_SCHED[2].start + 2.0, dur: 1.4},
];
window.TIMING.hook = HOOK_D;
window.TIMING.total = TOTAL + HOOK_D;
window.seek = function(tt){
  const hk = $('hook');
  if(tt < HOOK_D + 0.4){
    hk.style.display='flex';
    hk.style.opacity = tt > HOOK_D ? String(1-ease((tt-HOOK_D)/0.4)) : '1';
    const ts = [0.15, 0.75, 1.35, 2.2];
    ['hk0','hk1','hk2','hk3'].forEach((id,i)=>{
      const p = ease((tt-ts[i])/0.35);
      const e = $(id);
      e.style.opacity = String(p);
      e.style.transform = 'translateY('+(28*(1-p))+'px) scale('+(0.94+0.06*p)+')';
    });
  } else hk.style.display='none';
  const t = Math.max(0, tt - HOOK_D);
  for(const pp of POPS){
    const e = $(pp.el);
    const p = (t - pp.t0) / pp.dur;
    if(p<0||p>1){ e.style.opacity='0'; continue; }
    const inP = ease(p/0.18), outP = 1-ease((p-0.75)/0.25);
    e.style.opacity = String(Math.min(inP,outP));
    e.style.transform = 'scale('+(0.6+0.55*ease(p/0.22))+')';
  }
  seekInner(t);
};
const seekInner = function(t){
  /* ---------- Phase 1: input ---------- */
  const ip = $('inputScene');
  const ibTxt = $('ibTxt');
  const ib1 = $('ib1');
  $('header').style.opacity = t<4.0 ? '0' : String(ease((t-4.0)/0.4));
  if(t < 4.2){
    ip.style.display='block';
    ip.style.opacity = t>3.7 ? String(1-ease((t-3.7)/0.5)) : '1';
    ib1.classList.toggle('focused', t>0.4);
    const n = Math.floor(clamp((t-0.9)/1.6,0,1)*QUESTION.length);
    const caretOn = (Math.floor(t*2.2)%2===0) || (t>0.9&&t<2.5);
    const caret = t>0.4 ? '<span class="caret" style="opacity:'+(caretOn?1:0)+'"></span>' : '';
    ibTxt.innerHTML = n===0 ? '<span class="ph">问点什么…</span>'+caret : QUESTION.slice(0,n)+caret;
    const sb = $('sendBtn');
    sb.classList.toggle('armed', n>0);
    sb.classList.toggle('pressed', t>3.35 && t<3.65);
  } else {
    ip.style.display='none';
  }

  const ub = $('userBubble');
  const ubp = ease((t-4.0)/0.45);
  ub.style.opacity = String(ubp);
  ub.style.transform = 'translateY('+(20*(1-ubp))+'px)';

  /* ---------- Phase 2: thinking ---------- */
  const tp = $('thinkPanel');
  const tpp = ease((t-4.4)/0.5);
  tp.style.opacity = String(tpp);
  const collapsed = t>=COLLAPSE_T;
  tp.classList.toggle('collapsed', collapsed);
  $('thinkTitleTxt').textContent = collapsed
    ? ('已深度思考（用时 '+THINK_SECS+' 秒）')
    : 'Deep Fomo 深度思考中' + '.'.repeat(1+Math.floor(t*1.5)%3);
  if(collapsed){ $('thinkTitle').style.color='#8A97A8'; $('thinkTitle').style.marginBottom='0'; }
  else { $('thinkTitle').style.color='#C08A2D'; $('thinkTitle').style.marginBottom='28px'; }
  const spin = document.querySelector('#thinkTitle .spinner');
  spin.style.transform = 'rotate('+(t*360)+'deg)';
  for(let i=0;i<THINK.length;i++){
    const el = TL[i];
    const [a,b] = THINK_T[i];
    const L = segLen(THINK[i]);
    const n = Math.floor(clamp((t-a)/(b-a),0,1)*L);
    el.style.opacity = t>=a ? '1' : '0';
    el.innerHTML = typeSegs(THINK[i], n);
  }

  /* ---------- Phase 3: streaming answer ---------- */
  const ans = $('answer');
  ans.style.opacity = String(ease((t-ANS_FADE)/0.5));
  let lastVisible = -1;
  for(let i=0;i<ANSWER.length;i++){
    const sc = ANS_SCHED[i], el = ANS_P[i];
    if(t < sc.start){ el.style.display='none'; continue; }
    el.style.display='block';
    lastVisible = i;
    if(ANSWER[i].table){
      el.style.opacity = String(ease((t-sc.start)/0.8));
      continue;
    }
    const n = Math.floor(clamp((t-sc.start)/(sc.end-sc.start),0,1)*sc.len);
    let html = typeB(ANSWER[i].segs, n);
    const streamingHere = t < sc.end + ANS_GAP && t < ANS_DONE;
    if(streamingHere && i===lastVisible && t>=sc.start){
      html += '<span class="cursorBlock" style="opacity:'+((Math.floor(t*3)%2===0)?1:0.25)+'"></span>';
    }
    el.innerHTML = html;
  }
  const chat = $('chat');
  chat.style.transform = 'translateY(0px)';
  if(t > ANS_FADE){
    const rect = ansBody.getBoundingClientRect();
    const bottom = rect.top + rect.height;
    const overflow = Math.max(0, bottom - 1760);
    chat.style.transform = 'translateY('+(-overflow)+'px)';
  }

  /* ---------- Phase 4: ending ---------- */
  const dim = ease((t-END_T)/0.8);
  $('ending').style.background = 'rgba(245,247,250,'+dim+')';
  $('endCenter').style.opacity = String(ease((t-END_T-0.4)/0.6));
  $('endInput').style.opacity = String(ease((t-END_T-0.8)/0.6));
  $('endCaret').style.opacity = (Math.floor(t*2.2)%2===0)?'1':'0';
  $('disclaimer').style.opacity = String(ease((t-END_T-0.6)/0.8));
  for(const d of DM){
    const el = $(d.id);
    const p = (t-d.t0)/d.dur;
    if(p<0||p>1){ el.style.display='none'; continue; }
    el.style.display='block';
    el.style.top = d.y+'px';
    el.style.left = (1180 - p*(1180+900))+'px';
    el.style.opacity = String(Math.min(1, dim));
  }
};
window.seek(0);
</script>
</body>
</html>
