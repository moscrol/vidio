<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1080, initial-scale=1" />
    <title>FinHot visual taste baseline</title>
    <style>
      :root {
        --background: #07111f;
        --surface: #14213b;
        --text-primary: #f7f9ff;
        --text-muted: #b8c3d9;
        --accent: #6ee7ff;
        --warning: #ff6b8a;
        --violet: #aa7cff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: var(--background);
      }

      body {
        color: var(--text-primary);
        font-family: Arial, "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .frame {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 12% 14%, rgba(110, 231, 255, 0.27), transparent 31%),
          radial-gradient(circle at 91% 35%, rgba(170, 124, 255, 0.32), transparent 33%),
          radial-gradient(circle at 22% 74%, rgba(255, 107, 138, 0.22), transparent 36%),
          linear-gradient(148deg, #07111f 0%, #101a34 48%, #090d20 100%);
      }

      .frame::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        content: "";
        opacity: 0.28;
        background-image: repeating-linear-gradient(
          118deg,
          transparent 0,
          transparent 3px,
          rgba(255, 255, 255, 0.055) 4px,
          transparent 5px
        );
        mix-blend-mode: soft-light;
      }

      .orb {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        filter: blur(0.2px);
      }

      .orb-a {
        top: 52px;
        right: -130px;
        width: 430px;
        height: 430px;
        box-shadow: 0 0 110px rgba(110, 231, 255, 0.19) inset;
      }

      .orb-b {
        top: 420px;
        left: -190px;
        width: 540px;
        height: 540px;
        box-shadow: 0 0 130px rgba(255, 107, 138, 0.16) inset;
      }

      .topbar {
        position: absolute;
        top: 84px;
        right: 64px;
        left: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .kicker {
        padding: 17px 28px 16px;
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: 999px;
        background: rgba(13, 24, 49, 0.58);
        box-shadow:
          0 0 42px rgba(110, 231, 255, 0.22),
          0 18px 42px rgba(0, 0, 0, 0.25);
        font-family: "Trebuchet MS", "PingFang SC", sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.17em;
        backdrop-filter: blur(18px);
      }

      .hero {
        position: absolute;
        top: 207px;
        right: 64px;
        left: 64px;
        text-align: center;
      }

      h1 {
        max-width: 930px;
        margin: 0 auto;
        font-family: Georgia, "PingFang SC", serif;
        font-size: 82px;
        font-weight: 800;
        line-height: 1.08;
        letter-spacing: -0.055em;
        text-wrap: balance;
        text-shadow:
          0 0 52px rgba(110, 231, 255, 0.22),
          0 12px 45px rgba(0, 0, 0, 0.32);
      }

      h1 em {
        display: inline;
        color: transparent;
        font-style: normal;
        background: linear-gradient(95deg, var(--accent), #c29aff 48%, var(--warning));
        -webkit-background-clip: text;
        background-clip: text;
      }

      .features {
        position: absolute;
        top: 587px;
        right: 64px;
        left: 64px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .feature {
        position: relative;
        min-height: 292px;
        padding: 31px 28px 29px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 24px;
        background: linear-gradient(150deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.055));
        box-shadow:
          0 25px 70px rgba(0, 0, 0, 0.32),
          0 0 46px rgba(110, 231, 255, 0.15),
          inset 0 1px rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(22px);
      }

      .feature:nth-child(2) {
        transform: translateY(-18px);
        box-shadow:
          0 27px 74px rgba(0, 0, 0, 0.35),
          0 0 62px rgba(170, 124, 255, 0.29),
          inset 0 1px rgba(255, 255, 255, 0.22);
      }

      .feature:nth-child(3) {
        transform: translateY(10px);
        box-shadow:
          0 25px 70px rgba(0, 0, 0, 0.32),
          0 0 52px rgba(255, 107, 138, 0.19),
          inset 0 1px rgba(255, 255, 255, 0.22);
      }

      .feature::after {
        position: absolute;
        right: -44px;
        bottom: -54px;
        width: 170px;
        height: 170px;
        border-radius: 999px;
        content: "";
        background: radial-gradient(circle, rgba(110, 231, 255, 0.23), transparent 66%);
      }

      .feature-index {
        display: inline-flex;
        width: 50px;
        height: 50px;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        border: 1px solid rgba(110, 231, 255, 0.46);
        border-radius: 12px;
        color: var(--accent);
        background: rgba(110, 231, 255, 0.1);
        font-family: "Courier New", monospace;
        font-size: 22px;
        font-weight: 700;
        box-shadow: 0 0 28px rgba(110, 231, 255, 0.2);
      }

      .feature:nth-child(2) .feature-index {
        border-color: rgba(194, 154, 255, 0.54);
        color: #c29aff;
        background: rgba(194, 154, 255, 0.12);
      }

      .feature:nth-child(3) .feature-index {
        border-color: rgba(255, 107, 138, 0.52);
        color: var(--warning);
        background: rgba(255, 107, 138, 0.11);
      }

      .feature p {
        margin: 0;
        color: var(--text-primary);
        font-size: 30px;
        font-weight: 650;
        line-height: 1.4;
        letter-spacing: -0.025em;
      }

      .product {
        position: absolute;
        top: 944px;
        right: 64px;
        left: 64px;
        height: 680px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 40px;
        background: rgba(20, 33, 59, 0.65);
        box-shadow:
          0 34px 110px rgba(0, 0, 0, 0.48),
          0 0 88px rgba(170, 124, 255, 0.25),
          inset 0 1px rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(24px);
      }

      .product-head {
        display: flex;
        height: 83px;
        align-items: center;
        justify-content: space-between;
        padding: 0 33px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.13);
        font-family: "Trebuchet MS", "PingFang SC", sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .window-dots {
        display: flex;
        gap: 10px;
      }

      .window-dots i {
        width: 13px;
        height: 13px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 18px currentColor;
      }

      .window-dots i:nth-child(2) {
        background: #c29aff;
      }

      .window-dots i:nth-child(3) {
        background: var(--warning);
      }

      .screen {
        position: relative;
        height: 597px;
        overflow: hidden;
        background: #fff;
      }

      .screen img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }

      .screen::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        box-shadow: inset 0 0 60px rgba(110, 231, 255, 0.2);
      }

      .footer {
        position: absolute;
        top: 1682px;
        right: 64px;
        left: 64px;
        display: grid;
        grid-template-columns: 0.9fr 1.45fr;
        gap: 22px;
      }

      .source,
      .disclaimer {
        min-height: 118px;
        padding: 25px 27px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(20, 33, 59, 0.55);
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.23);
        color: var(--text-muted);
        font-size: 21px;
        line-height: 1.48;
        backdrop-filter: blur(16px);
      }

      .source {
        border-radius: 24px 12px 24px 40px;
      }

      .disclaimer {
        border-radius: 12px 40px 24px 24px;
      }

      .source strong,
      .disclaimer strong {
        display: block;
        margin-bottom: 7px;
        color: var(--accent);
        font-family: "Courier New", monospace;
        font-size: 18px;
        letter-spacing: 0.14em;
      }
    </style>
  </head>
  <body>
    <main class="frame" aria-label="FinHot generic AI SaaS visual baseline">
      <div class="orb orb-a" aria-hidden="true"></div>
      <div class="orb orb-b" aria-hidden="true"></div>

      <header class="topbar">
        <div class="kicker">FINHOT / SIGNAL WORKSPACE</div>
      </header>

      <section class="hero">
        <h1>把一整天的公开信源，<br /><em>压成可判断的研究流</em></h1>
      </section>

      <section class="features" aria-label="FinHot evidence points">
        <article class="feature">
          <span class="feature-index">01</span>
          <p>多源聚合：雪球、微博、公众号与更多公开信源</p>
        </article>
        <article class="feature">
          <span class="feature-index">02</span>
          <p>质量排序：高信号内容先浮上来</p>
        </article>
        <article class="feature">
          <span class="feature-index">03</span>
          <p>原文可追：保留来源，不替你下结论</p>
        </article>
      </section>

      <section class="product" aria-label="FinHot product proof">
        <div class="product-head">
          <span>真实界面 / 全部动态</span>
          <span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
        <div class="screen">
          <img src="../assets/d-feed.png" alt="FinHot 全部动态产品界面" />
        </div>
      </section>

      <footer class="footer">
        <div class="source">
          <strong>SOURCE</strong>
          FinHot 产品界面（本地截图，2026-08-22）
        </div>
        <div class="disclaimer">
          <strong>NOTICE</strong>
          演示仅说明信息整理流程，不构成投资建议。内容来自公开信源，最终判断由用户完成。
        </div>
      </footer>
    </main>
  </body>
</html>
