      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      tl.addLabel("orientFeed", 0);
      tl.fromTo(
        "#desktop-motion",

      tl.fromTo(

        { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },

      tl.to(

      tl.to(

        { scaleX: 0.55, opacity: 0, duration: 0.3, ease: "power3.in" },

        { y: 0, opacity: 1, scale: 1, duration: 0.4 },
