<!-- 真实 UI 手账贴图（来源 finhot-film v12 R11）：暖调 + multiply 罩 + 相框 + 胶带 + 2.5D -->
<style>
  .shotimg { filter: sepia(0.16) saturate(0.9) contrast(0.95) brightness(0.99); display: block; width: 100%; }
  .warmwash {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(158deg, rgba(240,224,196,0.10) 0%, rgba(206,166,108,0.20) 100%);
    mix-blend-mode: multiply;
  }
  .tape {
    position: absolute; width: 150px; height: 44px; z-index: 5;
    background: rgba(250,242,224,0.72);
    box-shadow: 0 4px 10px rgba(84,62,35,0.18);
    border-left: 1px dashed rgba(84,62,35,0.12);
    border-right: 1px dashed rgba(84,62,35,0.12);
  }
  .stage { position: absolute; inset: 0; perspective: 1700px; }
  .shotwrap {
    position: absolute; left: 50%; top: 44%;
    transform: translate(-50%, -50%) rotateX(7deg) rotateY(-6deg) scale(0.74);
    transform-style: preserve-3d;
  }
  .shot {
    position: absolute; inset: 0; border-radius: 22px; overflow: hidden;
    border: 12px solid rgba(255,251,242,0.55); /* 纸白相框 */
    box-shadow: 0 50px 130px rgba(84,62,35,0.35), inset 0 0 0 1px rgba(255,255,255,0.7);
    background: #fff;
  }
</style>

<div class="stage">
  <div class="shotwrap" id="wrap" style="width: 1560px; height: 1950px;">
    <div class="shot">
      <img class="shotimg" src="assets/真实截图.png" alt="" />
      <div class="warmwash" data-layout-ignore></div>
    </div>
    <!-- 胶带贴 wrap 上（不放 overflow:hidden 的 .shot 里） -->
    <div class="tape" data-layout-ignore style="left: -50px; top: -16px; transform: rotate(-38deg);"></div>
    <div class="tape" data-layout-ignore style="right: -46px; top: 30px; transform: rotate(34deg);"></div>
  </div>
</div>

<script>
/* 入场（焦外拉实）+ 缓推近 + 内容上滚：
tl.fromTo("#wrap",
  { y: 240, rotateX: 10, rotateY: -8.5, scale: 0.69, opacity: 0, filter: "blur(16px)" },
  { y: 0, rotateX: 7, rotateY: -6, scale: 0.74, opacity: 1, filter: "blur(0px)", duration: 1.15, ease: "power2.out" }, T);
tl.to("#wrap", { scale: 0.82, rotateY: -4, duration: 3.1, ease: "sine.inOut" }, T + 1.2);
tl.to("#wrap .shotimg", { y: -360, duration: 3.3, ease: "sine.inOut" }, T + 1.1);
注意：gsap 覆写 filter 时要带上完整 sepia 链（见 manifest.grade）。*/
</script>
