<!-- 任务清单打勾（spinner→tick 皮肤，提取自 v01）-->
<style>
  .task { display: flex; align-items: center; gap: 18px; }
  .task .slot { position: relative; width: 38px; height: 38px; flex: none; }
  .task .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.2); border-top-color: #FFC300;
  }
  .task .tick {
    position: absolute; inset: 0; border-radius: 50%;
    background: #FFC300; color: #000; font-weight: 900;
    display: flex; align-items: center; justify-content: center; opacity: 0;
  }
</style>
<div class="task" id="t1"><span class="slot"><span class="ring"></span><span class="tick">✓</span></span><span class="lb">检索今日公告与快讯</span></div>
