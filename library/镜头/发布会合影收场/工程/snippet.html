<script>

tl.fromTo("#wm", { scale: 1.28, opacity: 0, y: 20 }, { scale: 1, opacity: 1, y: 0, duration: 0.85, ease: "power2.out" }, T);

];

  const restBlur = 后排 ? 1.6 : 0;
  tl.fromTo(id, { x: x0, y: y0, opacity: 0, rotation: rEnd * 5, filter: "blur(12px)" },
    { x: 0, y: 0, opacity: 1, rotation: rEnd, filter: `blur(${restBlur}px)`, duration: 0.78, ease: "power2.out" }, t);
});

tl.set("#flash", { opacity: 0.65 }, T_收束);
