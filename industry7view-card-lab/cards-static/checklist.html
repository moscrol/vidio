<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>06 · Tracking Checklist Card</title>
  <link rel="stylesheet" href="_base.css" />
  <style>
    /* ============== Checklist-specific ============== */
    .checklist-card::after { display: none; }
    .check-title {
      color: var(--navy);
      font-size: 38px;
      font-weight: 900;
      left: 32px;
      letter-spacing: -0.06em;
      line-height: 1.08;
      position: absolute;
      right: 28px;
      top: 76px;
      z-index: 2;
    }
    .check-title::after {
      background: var(--gold);
      content: "";
      display: block;
      height: 3px;
      margin-top: 14px;
      width: 38px;
    }
    .check-list {
      display: grid;
      gap: 14px;
      left: 32px;
      position: absolute;
      right: 28px;
      top: 200px;
      z-index: 2;
    }
    .check-item {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(15, 39, 71, 0.14);
      border-left: 3px solid var(--gold);
      border-radius: 0;
      padding: 18px 20px 17px;
    }
    .check-no {
      color: var(--gold);
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .check-name {
      color: var(--navy);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.12;
    }
    .check-desc {
      color: var(--muted);
      font-size: 14px;
      font-weight: 750;
      line-height: 1.42;
      margin-top: 7px;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>06 · Tracking Checklist Card</h1>
    <p>跟踪信号清单（3 条投资跟踪指标）。</p>
    <div class="nav"><a href="index.html">← 返回总览</a></div>
  </header>

  <article class="video-card checklist-card">
    <div class="brand-row">
      <span class="tag">跟踪清单</span>
      <span class="brand">INDUSTRY 7VIEW</span>
    </div>
    <h2 class="check-title">半导体设备<br/><span style="color:var(--gold)">看三个信号</span></h2>
    <div class="check-list">
      <div class="check-item">
        <div class="check-no">01</div>
        <div class="check-name">进验证</div>
        <div class="check-desc">有没有进入头部晶圆厂验证。</div>
      </div>
      <div class="check-item">
        <div class="check-no">02</div>
        <div class="check-name">有复购</div>
        <div class="check-desc">有没有从首台套变成重复订单。</div>
      </div>
      <div class="check-item">
        <div class="check-no">03</div>
        <div class="check-name">能兑现</div>
        <div class="check-desc">收入和毛利有没有真正兑现。</div>
      </div>
    </div>
    <div class="bottom-note">看投资兑现：验证、复购、毛利。</div>
  </article>
</body>
</html>
